[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sportmatch-clubs-service"
version = "0.1.0"
description = "SportMatch clubs microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.1.1,<3.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "psycopg[binary,pool]>=3.1.18,<4.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
